name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Everything except the shell, which needs Qt and a KDE session. Those crates are the ones
  # worth gating a merge on anyway: all the logic lives in them.
  crates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install what the crates link against
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libpipewire-0.3-dev libspa-0.2-dev libudev-dev libwayland-dev \
            libsqlite3-dev libclang-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The install example names a version, and a stale one sends people at a file that is not
      # there. Three places hold the version and this is the fourth, so it is checked rather
      # than remembered.
      - name: The documented version must be the one being built
        run: |
          set -eu
          declared=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          for file in README.md docs/index.html; do
            documented=$(grep -oE 'version=[0-9]+\.[0-9]+\.[0-9]+' "$file" | head -1 | cut -d= -f2)
            if [ "$documented" != "$declared" ]; then
              echo "$file documents $documented and the package is $declared"
              exit 1
            fi
          done

      - run: cargo fmt --all --check

      # Named by exclusion rather than one by one, or the list rots the next time a crate
      # arrives or leaves.
      - name: Lint
        run: cargo clippy --all-targets --workspace --exclude kavverna-shell

      # The tests that need a live compositor, a live session bus or real sensors carry
      # `#[ignore]` and say what they need, so this picks up everything else. Selecting with
      # `--lib` instead would drop the integration tests that are perfectly happy on a runner,
      # among them the one guarding the persisted feature ids.
      - name: Test
        run: cargo test --workspace --exclude kavverna-shell

  # Proves the whole thing still builds where it is meant to run.
  shell:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install the desktop it targets
        run: |
          pacman -Syu --noconfirm --needed \
            git rust qt6-base qt6-declarative layer-shell-qt kirigami \
            pipewire libpipewire clang pkgconf sqlite sudo

      - uses: actions/checkout@v5

      - run: cargo build --workspace --locked

      # .SRCINFO is generated from the PKGBUILD and is what the AUR reads, so a stale one hands
      # people the wrong dependencies and the wrong version. It sat two releases behind before
      # anyone noticed, which is what a check is for.
      - name: The package metadata must match the package definition
        run: |
          set -eu
          useradd --create-home builder
          chown -R builder:builder .
          cd packaging
          sudo -u builder makepkg --printsrcinfo > /tmp/generated.SRCINFO
          diff -u .SRCINFO /tmp/generated.SRCINFO
