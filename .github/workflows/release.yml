name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # Only what the suite below links against. What the package needs is declared in the
      # PKGBUILD, and makepkg installs it, so there is no second dependency list here to drift
      # out of step with that one.
      - name: Install what the tests link against
        run: |
          pacman -Syu --noconfirm --needed \
            git rust clang pkgconf sudo libpipewire sqlite

      - uses: actions/checkout@v5

      # A tag can be pushed at any commit, so the suite runs here too rather than trusting that
      # CI was green on whatever this points at.
      - name: Test
        run: cargo test --workspace --exclude kavverna-shell --locked

      # The tag names the release and the package names itself from the PKGBUILD. Catching a
      # disagreement here beats publishing a v0.2.0 release carrying a 0.1.5 package.
      - name: The tag and the PKGBUILD must agree
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          declared=$(sed -n 's/^pkgver=//p' packaging/PKGBUILD)
          if [ "$declared" != "${TAG#v}" ]; then
            echo "PKGBUILD says $declared and the tag says ${TAG#v}"
            exit 1
          fi

      # makepkg refuses to run as root and this container is root, so the build happens as
      # somebody else and the checkout has to be theirs to write in.
      - name: Make an unprivileged builder
        run: |
          useradd --create-home builder
          # --syncdeps installs what the PKGBUILD declares, and installing needs pacman.
          printf 'builder ALL=(ALL) NOPASSWD: /usr/bin/pacman\n' > /etc/sudoers.d/builder
          chown -R builder:builder .

      # The PKGBUILD takes its source from the tag being released, which exists by the time this
      # runs. --nocheck because the suite already ran above, on this same commit, and running it
      # a second time in one job buys nothing. The fourth version number is passed explicitly
      # rather than through sudo's environment rules, and asserted afterwards.
      - name: Build the package
        env:
          KAVVERNA_BUILD: ${{ github.run_number }}
        working-directory: packaging
        run: |
          set -eu
          sudo -u builder env KAVVERNA_BUILD="$KAVVERNA_BUILD" \
            makepkg --syncdeps --nocheck --noconfirm

      - name: The package must know which build made it
        env:
          KAVVERNA_BUILD: ${{ github.run_number }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          built="packaging/src/kavverna/target/release/kavverna-shell"
          reported=$("$built" --version)
          if [ "$reported" != "${TAG#v}.$KAVVERNA_BUILD" ]; then
            echo "the binary reports $reported, expected ${TAG#v}.$KAVVERNA_BUILD"
            exit 1
          fi
          pacman -Qip packaging/*.pkg.tar.zst

      - name: Collect what the release carries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          name="kavverna-${TAG#v}-x86_64"
          mkdir -p "dist/$name"
          cp packaging/src/kavverna/target/release/kavverna-shell "dist/$name/"
          cp README.md LICENSE CHANGELOG.md CREDITS.md "dist/$name/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          cp packaging/*.pkg.tar.zst dist/
          # A second copy under a name that carries no version, so
          # releases/latest/download/kavverna-x86_64.pkg.tar.zst is a URL that never changes and
          # the install instructions never go stale. pacman reads the version from the package
          # rather than from the file name, so this installs as the release it came from.
          cp packaging/*.pkg.tar.zst dist/kavverna-x86_64.pkg.tar.zst
          # Written from inside dist, or the checksum file names a path that is not there once
          # the file has been downloaded on its own.
          cd dist
          for file in *.tar.gz *.pkg.tar.zst; do
            sha256sum "$file" > "$file.sha256"
          done

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.pkg.tar.zst
            dist/*.sha256
          generate_release_notes: true
          body: |
            Built on Arch with Qt 6 for KDE Plasma 6 on Wayland. See CHANGELOG.md for what
            changed, and the README for what this still cannot do.

            The `.pkg.tar.zst` installs with `sudo pacman -U`. Building it yourself with
            `makepkg -si` is the better route on a machine you keep, since it links against the
            libraries that machine has rather than the ones Arch shipped on the day of this
            release.
